{% extends "base.html" %}
{% block content %}
<h1>Editar anúncio</h1>
<h2>{{ item.title }}</h2>

{% if error %}
<div class="warning">
  <strong>O Mercado Livre recusou a alteração:</strong><br>
  {{ error }}
</div>
{% endif %}

<form method="post" action="/items/{{ item.id }}/edit" class="form-grid">
  <label>Preço (R$)<input type="number" step="0.01" name="price" value="{{ item.price }}" required></label>
  <label>Estoque disponível<input type="number" name="available_quantity" value="{{ item.available_quantity }}" required></label>
  <label>SKU<input type="text" name="sku" value="{{ item.seller_custom_field or '' }}"></label>
  <label>Custo (R$) <small>(preço que você paga por esse produto)</small>
    <input type="number" step="0.01" name="cost_price" value="{{ cost if cost is not none else '' }}">
  </label>
  <button class="btn" type="submit">Salvar alterações</button>
</form>

<p><a href="/items">&larr; voltar para a lista de anúncios</a></p>
{% endblock %}
